="210" height="58" rx="11.600000000000001" fill="#DCD3F7" stroke="#6E51D8" stroke-width="1" /><text x="890" y="614.08" font-size="12" text-anchor="middle" fill="#20202b" font-weight="400" font-style="normal"><tspan x="890" dy="0">Anexar o resultado (CONCLUIDO)</tspan></text><rect x="445" y="681" width="210" height="58" rx="11.600000000000001" fill="#DCD3F7" stroke="#6E51D8" stroke-width="1" /><text x="550" y="714.08" font-size="12" text-anchor="middle" fill="#20202b" font-weight="400" font-style="normal"><tspan x="550" dy="0">Notificar o paciente e o médico</tspan></text><polygon points="210,773 285,810 210,847 135,810" fill="#FDE7D6" stroke="#C8824A" stroke-width="1"/><text x="210" y="806.92" font-size="11" text-anchor="middle" fill="#20202b" font-weight="400" font-style="normal"><tspan x="210" dy="0">Há prazo de</tspan><tspan x="210" dy="13.64">retorno?</tspan></text><rect x="105" y="881" width="210" height="58" rx="11.600000000000001" fill="#DCD3F7" stroke="#6E51D8" stroke-width="1" /><text x="210" y="906.64" font-size="12" text-anchor="middle" fill="#20202b" font-weight="400" font-style="normal"><tspan x="210" dy="0">Agendar o retorno dentro do</tspan><tspan x="210" dy="14.879999999999999">prazo</tspan></text><rect x="445" y="981" width="210" height="58" rx="11.600000000000001" fill="#DCD3F7" stroke="#6E51D8" stroke-width="1" /><text x="550" y="1006.64" font-size="12" text-anchor="middle" fill="#20202b" font-weight="400" font-style="normal"><tspan x="550" dy="0">Registrar a consulta de retorno</tspan><tspan x="550" dy="14.879999999999999">(AGENDADA)</tspan></text><polygon points="550,1088 572,1110 550,1132 528,1110" fill="#FDE7D6" stroke="#C8824A" stroke-width="1"/><polygon points="1230,273 1305,310 1230,347 1155,310" fill="#FDE7D6" stroke="#C8824A" stroke-width="1"/><text x="1230" y="313.74" font-size="11" text-anchor="middle" fill="#20202b" font-weight="400" font-style="normal"><tspan x="1230" dy="0">Recebeu receita?</tspan></text><rect x="1125" y="381" width="210" height="58" rx="11.600000000000001" fill="#DCD3F7" stroke="#6E51D8" stroke-width="1" /><text x="1230" y="406.64" font-size="12" text-anchor="middle" fill="#20202b" font-weight="400" font-style="normal"><tspan x="1230" dy="0">Buscar as receitas pelo CPF do</tspan><tspan x="1230" dy="14.879999999999999">paciente</tspan></text><rect x="1125" y="481" width="210" height="58" rx="11.600000000000001" fill="#DCD3F7" stroke="#6E51D8" stroke-width="1" /><text x="1230" y="506.64" font-size="12" text-anchor="middle" fill="#20202b" font-weight="400" font-style="normal"><tspan x="1230" dy="0">Registrar a retirada do</tspan><tspan x="1230" dy="14.879999999999999">medicamento</tspan></text><polygon points="1230,588 1252,610 1230,632 1208,610" fill="#FDE7D6" stroke="#C8824A" stroke-width="1"/><polygon points="1570,273 1645,310 1570,347 1495,310" fill="#FDE7D6" stroke="#C8824A" stroke-width="1"/><text x="1570" y="313.74" font-size="11" text-anchor="middle" fill="#20202b" font-weight="400" font-style="normal"><tspan x="1570" dy="0">Boleto pendente?</tspan></text><rect x="1465" y="381" width="210" height="58" rx="11.600000000000001" fill="#DCD3F7" stroke="#6E51D8" stroke-width="1" /><text x="1570" y="406.64" font-size="12" text-anchor="middle" fill="#20202b" font-weight="400" font-style="normal"><tspan x="1570" dy="0">Receber o pagamento e dar baixa</tspan><tspan x="1570" dy="14.879999999999999">(PAGO)</tspan></text><polygon points="1570,488 1592,510 1570,532 1548,510" fill="#FDE7D6" stroke="#C8824A" stroke-width="1"/><rect x="400" y="1206" width="300" height="8" rx="0" fill="#1E1B2E" stroke="#1E1B2E" stroke-width="1" /><ellipse cx="550" cy="1310" rx="17" ry="17" fill="#fff" stroke="#1E1B2E" stroke-width="1"/><ellipse cx="550" cy="1310" rx="11.56" ry="11.56" fill="#1E1B2E"/><path d="M40 1440H1516l14 14V1510H40Z M1516 1440v14h14" fill="#FFFDE7" stroke="#C8B84A"/><text x="48" y="1471.6399999999999" font-size="12" text-anchor="start" fill="#20202b" font-weight="400" font-style="normal"><tspan x="48" dy="0">Começa quando o atendimento é finalizado (aba &quot;Do agendamento ao atendimento&quot;). Os três caminhos acontecem em paralelo: exame e retorno, receita e pagamento. A consulta de retorno segue de novo o fluxo da primeira aba, a partir do</tspan><tspan x="48" dy="14.879999999999999">check-in.</tspan></text><text x="210" y="360" font-size="11" text-anchor="middle" fill="#252331" stroke="white" stroke-width="3" paint-order="stroke">[sim]</text><text x="210" y="860" font-size="11" text-anchor="middle" fill="#252331" stroke="white" stroke-width="3" paint-order="stroke">[sim]</text><text x="362" y="1000.5" font-size="11" text-anchor="middle" fill="#252331" stroke="white" stroke-width="3" paint-order="stroke">[não]</text><text x="58" y="902.5" font-size="11" text-anchor="middle" fill="#252331" stroke="white" stroke-width="3" paint-order="stroke">[não]</text><text x="1230" y="360" font-size="11" text-anchor="middle" fill="#252331" stroke="white" stroke-width="3" paint-order="stroke">[sim]</text><text x="1078" y="482.5" font-size="11" text-anchor="middle" fill="#252331" stroke="white" stroke-width="3" paint-order="stroke">[não]</text><text x="1570" y="360" font-size="11" text-anchor="middle" fill="#252331" stroke="white" stroke-width="3" paint-order="stroke">[sim]</text><text x="1418" y="432.5" font-size="11" text-anchor="middle" fill="#252331" stroke="white" stroke-width="3" paint-order="stroke">[não]</text></g></svg>