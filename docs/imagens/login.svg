<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Arial, Helvetica, sans-serif"><title>Representação da interface de login com base no código-fonte</title><rect width="1280" height="820" fill="#dfe8d8"/><rect x="14" y="14" width="1252" height="792" rx="18" fill="#fff"/><g fill="#1c1b22"><rect x="70" y="46" width="32" height="32" rx="10" fill="#7358d1"/><path d="M86 54v16m-8-8h16" stroke="white" stroke-width="4" stroke-linecap="round"/><text x="112" y="68" fill="#5c41bb" font-size="21" font-weight="700">Agenda-Saúde</text><text x="70" y="192" font-size="48" font-weight="650"><tspan x="70">Sua consulta,</tspan><tspan x="70" dy="53">do check-in</tspan><tspan x="70" dy="53">ao retorno.</tspan></text><text x="70" y="335" fill="#4b4a57" font-size="17"><tspan x="70">Marque consultas, acompanhe a fila pelo celular</tspan><tspan x="70" dy="26">e encontre seus exames e receitas num só lugar.</tspan></text><text x="70" y="413" font-size="25" font-weight="700">Entrar</text><text x="70" y="452" font-size="15" font-weight="700">E-mail</text><rect x="70" y="464" width="460" height="48" rx="12" fill="white" stroke="#d9d8e2"/><text x="70" y="543" font-size="15" font-weight="700">Senha</text><rect x="70" y="555" width="460" height="48" rx="12" fill="white" stroke="#d9d8e2"/><rect x="70" y="622" width="460" height="49" rx="14" fill="#7358d1"/><text x="300" y="653" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Entrar</text><text x="70" y="703" font-size="15" font-weight="600" fill="#7358d1">Esqueci minha senha</text><text x="530" y="703" font-size="15" text-anchor="end">Primeira vez? <tspan fill="#7358d1" font-weight="600">Criar conta de paciente</tspan></text><rect x="654" y="250" width="350" height="240" rx="30" fill="#bfe1f2"/><text x="682" y="354" font-size="15">Hoje</text><text x="682" y="420" font-size="76" font-weight="650">09:30</text><text x="682" y="460" font-size="17" font-weight="700">Check-in feito. Você é o 2º da fila.</text><circle cx="995" cy="257" r="27" fill="#bfe1f2" stroke="white" stroke-width="6"/><path d="m987 249 16 16m0-12v12h-12" fill="none" stroke="#1c1b22" stroke-width="2.5" stroke-linecap="round"/><rect x="1016" y="250" width="188" height="240" rx="27" fill="#cbbff4"/><circle cx="1110" cy="350" r="52" fill="#fff" opacity=".55"/><text x="1110" y="361" text-anchor="middle" font-size="34" font-weight="750">HP</text><text x="1110" y="427" text-anchor="middle" font-size="15">Cardiologia</text><rect x="654" y="502" width="269" height="114" rx="26" fill="#b2cba5"/><text x="679" y="545" font-size="15">Resultado pronto</text><text x="679" y="578" font-size="20" font-weight="700">Retorno até 18/11</text><rect x="935" y="533" width="269" height="60" rx="30" fill="#f8cfae"/><g fill="none" stroke="#1c1b22" stroke-width="2"><circle cx="966" cy="563" r="12"/><circle cx="981" cy="563" r="12"/><circle cx="996" cy="563" r="12"/></g><text x="1022" y="569" font-size="17" font-weight="700">Fila ao vivo</text><path d="M648 398q2 10 13 13-11 3-13 13-3-10-13-13 10-3 13-13Z" fill="#7f9f71"/><circle cx="1205" cy="385" r="8" fill="#cbbff4"/><circle cx="1031" cy="620" r="12" fill="#bfe1f2"/></g></svg>