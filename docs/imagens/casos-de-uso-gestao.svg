font-style="normal"><tspan x="251" dy="0">Legenda</tspan><tspan x="251" dy="16.12">■ cinza: todos os usuários · ■ pêssego: laboratório, farmácia e financeiro · ■ azul: recepção · ■ rosa: administrador</tspan><tspan x="251" dy="16.12">Usuário e Funcionário são atores abstratos. O Administrador herda os casos de uso da Recepcionista. Os casos do Paciente, da Recepção e do Médico estão na aba Atendimento ao paciente.</tspan></text><text x="1920" y="961" font-size="12" text-anchor="middle" fill="#252331" stroke="white" stroke-width="3" paint-order="stroke">«include»</text></g></svg>